<script>

    console.log(val[0].description)
    console.log(val[0].category)
    let productInfo = `
            <h2>${val[0].title}</h2>
            <p><strong>Price:</strong> $${val[0].price}</p>
            <p><strong>Category:</strong> ${val[0].category}</p>
            <p>${val[0].description}</p>
        `;

        let div = document.createElement("div");
        div.innerHTML = productInfo;
        document.body.appendChild(div);
})
